services:
  - type: web
    name: sidequestre-api
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: sidequestre-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false # Set manually in Render Dashboard

databases:
  - name: sidequestre-db
    plan: free
    postgresMajorVersion: 16
